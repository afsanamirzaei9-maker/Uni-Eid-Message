<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>عید سعید اضحی مبارک</title>

<meta name="title"
content="پیام تبریکی عید از طرف محصلین سمستر ششم دانشکده کمپیوتر دانشگاه آنلاین زن">

<meta name="description"
content="محصلین سمستر ششم دانشکده کمپیوتر ساینس دانشگاه آنلاین زن، عید سعید اضحی را به بورد اداری دانشگاه، اساتید[...]

<meta property="og:title"
content="پیام تبریکی عید از طرف محصلین سمستر ششم دانشکده کمپیوتر دانشگاه آنلاین زن">

<meta property="og:description"
content="عید سعید اضحی مبارک 🌙">

<meta property="og:image"
content="uniLogo.jpg">

<meta name="theme-color"
content="#09111f">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}

html,body{
height:100%;
}

body{
overflow:hidden;
background:
radial-gradient(circle at top,#111936,#04060d 60%,#000);
color:white;
}

.container{
height:100vh;
position:relative;
overflow:hidden;
}

.star{
position:absolute;
width:2px;
height:2px;
border-radius:50%;
background:#fff;

box-shadow:
0 0 10px #fff,
0 0 20px #7aa2ff;

animation:twinkle linear infinite;
}

@keyframes twinkle{

50%{
opacity:.2;
transform:scale(.5)
}

100%{
opacity:1
}

}

.glow{

position:absolute;

width:500px;
height:500px;

border-radius:50%;

background:
radial-gradient(
rgba(90,120,255,.2),
transparent
);

filter:blur(80px);

left:50%;
top:50%;

transform:
translate(-50%,-50%);
}

.center{

position:absolute;
inset:0;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

text-align:center;

padding:20px;
}

.intro h1{

font-size:
clamp(25px,5vw,55px);

line-height:1.8;

max-width:900px;
}

.tap{
margin-top:25px;
opacity:.7;
font-size:14px;
}

.main{

display:none;

opacity:0;

transform:
translateY(40px);

transition:1.5s;

width:100%;
max-width:900px;
margin:auto;
}

.main.show{

display:flex;

flex-direction:column;

opacity:1;

transform:none;
}

.title{

font-size:
clamp(30px,5vw,60px);

margin-bottom:25px;
}

.typing{

font-size:
clamp(15px,2.8vw,20px);

line-height:2.2;

padding:15px;

border-left:
2px solid white;

min-height:180px;
}

.card{

margin:25px auto;

width:min(90%,600px);

padding:22px;

border-radius:25px;

background:
rgba(255,255,255,.05);

backdrop-filter:
blur(18px);

border:
1px solid rgba(255,255,255,.08);
}

.card h3{
line-height:2;
margin-bottom:15px;
}

input,
textarea{

width:100%;

background:
rgba(255,255,255,.08);

border:none;

outline:none;

padding:15px;

border-radius:15px;

color:white;

margin-bottom:15px;
}

textarea{
height:120px;
resize:none;
}

button{

border:none;

padding:13px 30px;

border-radius:15px;

background:#8aa5ff;

cursor:pointer;

font-size:15px;
}

.wish{

margin-top:15px;

color:#9ac0ff;

line-height:2;
}

.footer{

position:fixed;

bottom:12px;

left:50%;

transform:translateX(-50%);

opacity:.45;

font-size:12px;

z-index:1;

pointer-events:none;

transition:.4s;
}

.footer.hide{
opacity:0;
}

@media(max-width:700px){

body{
overflow:auto;
}

.main{
padding-top:90px;
padding-bottom:140px; /* افزایش فضا برای جلوگیری از هم‌پوشانی پیام با فوتر */
}

.typing{
min-height:auto;
}

}

</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="eid-music.mp3" type="audio/mp3">
</audio>


<div class="container" id="container">

<div class="glow"></div>


<div class="center intro" id="intro">

<h1>

🌟 پیام‌هایی که از دل یک خانواده علمی برمی‌خیزند، همیشه رنگی از صمیمیت دارند...

</h1>

<div class="tap">

برای مشاهده پیام لمس کنید ✨

</div>

</div>


<div class="center main" id="main">

<div class="title">
🌙 عید سعید اضحی مبارک 🌙
</div>


<div class="typing" id="typing"></div>


<div class="card">

<h3>

💌 خوشحال می‌شویم اگر پیام عیدی تان را اینجا برای ما بنویسید

</h3>


<form
action="https://formspree.io/f/xojbprkj"
method="POST"
id="wishForm"
>

<input
type="text"
name="name"
placeholder="نام شما ✨"
required
>

<textarea
name="message"
placeholder="پیام عیدی شما..."
required
></textarea>


<button type="submit">

ارسال پیام ✨

</button>

</form>

<div class="wish" id="wish"></div>

</div>


<p>
Developed by: Afsana Mirzaei
</p>

</div>


<div class="footer">
تقدیم به دانشگاه آنلاین زن
</div>

</div>


<script>

const container=
document.getElementById("container");

const intro=
document.getElementById("intro");

const main=
document.getElementById("main");

const typing=
document.getElementById("typing");

const music=
document.getElementById("bgMusic");

const wish=
document.getElementById("wish");

const form=
document.getElementById("wishForm");

const footer=
document.querySelector(".footer");


for(let i=0;i<160;i++){

let s=
document.createElement("div");

s.className='star';

s.style.left=
Math.random()*100+'%';

s.style.top=
Math.random()*100+'%';

s.style.animationDuration=
(1+Math.random()*4)+'s';

document.body.appendChild(s);

}


const text=`💙 محصلین سمستر ششم دانشکده کمپیوتر ساینس دانشگاه آنلاین زن،

🌙 عید سعید اضحی را به بورد اداری دانشگاه، اساتید محترم، هم دانشگاهی‌های عزیز و تمام مسلمانان جهان صمیمانه تب[...]

✨ آرزو داریم عیدی سرشار از خوشی را در کنار خانواده‌های تان تجربه کنید ❤️`;



container.addEventListener(
"click",
showPage,
{once:true}
);


function showPage(){

intro.style.display="none";

main.classList.add("show");

music.play().catch(()=>{});

let i=0;

let t=setInterval(()=>{

if(i<text.length){

typing.innerHTML+=text.charAt(i);

i++;

}else{

clearInterval(t);

}

},35)

}



document
.querySelectorAll(
"input,textarea"
)

.forEach(el=>{

el.addEventListener(

"focus",

()=>{

footer.classList.add(
"hide"
)

}

);


el.addEventListener(

"blur",

()=>{

footer.classList.remove(
"hide"
)

}

);

});



form.addEventListener(

"submit",

async function(e){

e.preventDefault();

const btn=
this.querySelector(
"button"
);

btn.disabled=true;

btn.innerHTML=
"در حال ارسال...";


try{

const response=

await fetch(

this.action,

{

method:"POST",

body:new FormData(this),

headers:{

Accept:
"application/json"

}

}

);


if(response.ok){

wish.innerHTML=`

✨ سپاس از پیام زیبای عیدی شما 💙

<br><br>

🌙 عیدتان مبارک و روزهای‌تان پر از آرامش و شادی

`;

this.reset();

}else{

wish.innerHTML=
"❌ ارسال انجام نشد"

}

}catch{

wish.innerHTML=
"❌ خطا در اتصال"

}


btn.disabled=false;

btn.innerHTML=
"ارسال پیام ✨";

}

);

</script>

</body>
</html>
